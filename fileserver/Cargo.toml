[package]
name = "fileserver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fileserver"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
bytes = "1"
russh = "0.60.1"
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
pkcs5 = "=0.8.0-rc.13"
russh-sftp = "2.0"
async-trait = "0.1"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
opensrv-mysql = "0.4"
bcrypt = "0.15"

[dev-dependencies]
tempfile = "3"

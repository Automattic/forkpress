name: docs

on:
  pull_request:
    paths:
      - "README.md"
      - "README.mdx"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "docs/**"
      - "crates/**/README.md"
      - "crates/**/README.mdx"
      - "experiments/**/README.md"
      - "experiments/**/README.mdx"
      - "installer/**/README.md"
      - "installer/**/README.mdx"
      - "packages/**/README.md"
      - "packages/**/README.mdx"
      - "components/**/README.md"
      - "components/**/README.mdx"
      - "runtime/**/README.md"
      - "runtime/**/README.mdx"
      - "scripts/**/README.md"
      - "scripts/**/README.mdx"
      - "wp-plugin/**/README.md"
      - "wp-plugin/**/README.mdx"
      - ".github/workflows/docs.yml"
  push:
    branches: ["trunk"]
    paths:
      - "README.md"
      - "README.mdx"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "public/**"
      - "docs/**"
      - "crates/**/README.md"
      - "crates/**/README.mdx"
      - "experiments/**/README.md"
      - "experiments/**/README.mdx"
      - "installer/**/README.md"
      - "installer/**/README.mdx"
      - "packages/**/README.md"
      - "packages/**/README.mdx"
      - "components/**/README.md"
      - "components/**/README.mdx"
      - "runtime/**/README.md"
      - "runtime/**/README.mdx"
      - "scripts/**/README.md"
      - "scripts/**/README.mdx"
      - "wp-plugin/**/README.md"
      - "wp-plugin/**/README.mdx"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate docs
        run: npm run validate

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

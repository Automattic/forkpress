name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'forkpress/**'
      - 'ext/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'sql/**'
      - 'wp-plugin/**'
      - 'vendor/**'
      - 'scripts/build-dist.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            os: darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            os: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (mac)
        if: matrix.os == 'darwin'
        run: |
          brew install composer gpatch
          # php-cli from brew drives static-php-cli
          brew install php || true

      - name: Install toolchain (linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang curl git pkg-config unzip \
            musl-tools php-cli composer re2c bison

      # Static PHP builds are slow (3-5 min of compilation). Cache the whole
      # .build/ directory so we skip the clone, composer install, downloads,
      # and the PHP/lib compilation when inputs haven't changed. Cache key
      # includes every input that affects the produced binaries.
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: >-
            build-${{ matrix.target }}-${{ hashFiles(
              'scripts/build-dist.sh',
              'scripts/spc-patch-branchfs.php',
              'ext/branchfs.c',
              'ext/branchfs.h',
              'forkpress/build.rs',
              'forkpress/zfs-engine/Makefile',
              'forkpress/zfs-engine/forkpress_zfs.c',
              'forkpress/zfs-engine/include/libintl.h',
              'forkpress/zfs-engine/include/sys/endian.h',
              'forkpress/zfs-engine/include/sys/simd.h',
              'forkpress/zfs-engine/include/sys/stdtypes.h',
              'forkpress/zfs-engine/include/sys/sysmacros.h',
              'forkpress/zfs-engine/include/sys/types32.h',
              'forkpress/zfs-engine/include/sys/uio.h'
            ) }}

      - name: Build dist bundle
        run: scripts/build-dist.sh
        env:
          FORKPRESS_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build forkpress
        run: cargo build --release --target ${{ matrix.target }} -p forkpress

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ github.workspace }}/forkpress-${{ matrix.target }}.tar.gz forkpress

      - uses: actions/upload-artifact@v4
        with:
          name: forkpress-${{ matrix.target }}
          path: forkpress-${{ matrix.target }}.tar.gz
          retention-days: 14

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: forkpress-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: forkpress-*.tar.gz
          generate_release_notes: true

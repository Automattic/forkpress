name: ci

on:
  pull_request:
    paths:
      - "crates/**"
      - "experiments/**"
      - "runtime/**"
      - "scripts/**"
      - "installer/**"
      - "tests/**"
      - "wp-plugin/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: ["trunk"]

jobs:
  linux-cow-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake build-essential clang curl git pkg-config unzip \
            musl-tools php-cli composer re2c bison nodejs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust unit tests (workspace crates)
        run: |
          cargo test --workspace --exclude forkpress-cli
          cargo test -p forkpress-core --features dev-experiments

      - name: Rust unit tests
        run: FORKPRESS_RUNTIME_BUNDLE=/dev/null cargo test -p forkpress-cli --bin forkpress

      - name: Rust unit tests (dev experiments)
        run: FORKPRESS_RUNTIME_BUNDLE=/dev/null cargo test -p forkpress-cli --features dev-experiments --bin forkpress-dev

      - name: Build production dist bundle
        run: scripts/build-dist.sh
        env:
          FORKPRESS_TARGET: x86_64-unknown-linux-musl
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build forkpress
        run: cargo build --release --target x86_64-unknown-linux-musl -p forkpress-cli --bin forkpress

      - name: COW strategy e2e
        run: tests/cow/e2e.sh target/x86_64-unknown-linux-musl/release/forkpress

      - name: Build dev dist bundle
        run: scripts/build-dist.sh
        env:
          FORKPRESS_RUNTIME_PROFILE: dev
          FORKPRESS_TARGET: x86_64-unknown-linux-musl
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build forkpress-dev
        run: cargo build --release --target x86_64-unknown-linux-musl -p forkpress-cli --features dev-experiments --bin forkpress-dev

      - name: CAS strategy e2e (dev)
        run: experiments/cas/tests/e2e.sh target/x86_64-unknown-linux-musl/release/forkpress-dev

  mac-cow-e2e:
    name: mac-cow-e2e ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust unit tests (workspace crates)
        run: |
          cargo test --target ${{ matrix.target }} --workspace --exclude forkpress-cli
          cargo test --target ${{ matrix.target }} -p forkpress-core --features dev-experiments

      - name: Rust unit tests
        run: FORKPRESS_RUNTIME_BUNDLE=/dev/null cargo test --target ${{ matrix.target }} -p forkpress-cli --bin forkpress

      - name: Rust unit tests (dev experiments)
        run: FORKPRESS_RUNTIME_BUNDLE=/dev/null cargo test --target ${{ matrix.target }} -p forkpress-cli --features dev-experiments --bin forkpress-dev

      - name: Install runtime build tools
        run: |
          brew update
          brew install composer gpatch automake re2c bison pkg-config
          brew install php || true

      - name: Build production dist bundle
        run: scripts/build-dist.sh
        env:
          FORKPRESS_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build forkpress
        run: cargo build --release --target ${{ matrix.target }} -p forkpress-cli --bin forkpress

      - name: COW strategy e2e through APFS sparsebundle
        run: tests/cow/e2e.sh target/${{ matrix.target }}/release/forkpress
        env:
          FORKPRESS_FORCE_MACOS_APFS_SPARSEBUNDLE: "1"

  windows-cow-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust unit tests (workspace crates)
        shell: pwsh
        run: |
          cargo test --target x86_64-pc-windows-msvc --workspace --exclude forkpress-cli

      - name: Rust unit tests (CLI)
        shell: pwsh
        run: |
          $bundle = Join-Path $pwd 'empty-runtime.tar.gz'
          Set-Content -Path $bundle -Value '' -NoNewline
          $env:FORKPRESS_RUNTIME_BUNDLE = $bundle
          cargo test --target x86_64-pc-windows-msvc -p forkpress-cli --bin forkpress

      - name: Windows script syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/windows/build-dist.ps1',
            'scripts/windows/install.ps1',
            'scripts/windows/setup-dev-drive.ps1',
            'scripts/windows/package.ps1',
            'scripts/windows/sign.ps1'
          )) {
            [scriptblock]::Create((Get-Content -Raw $script)) | Out-Null
          }

      - name: Windows installer error-surface checks
        shell: pwsh
        run: tests/windows/installer-error-surface.ps1

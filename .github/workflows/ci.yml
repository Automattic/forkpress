name: ci

on:
  pull_request:
    paths:
      - 'forkpress/**'
      - 'ext/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'sql/**'
      - 'tests/**'
      - 'wp-plugin/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  push:
    branches: ['trunk']

jobs:
  mac-release-artifact-cas-smoke:
    runs-on: macos-14
    steps:
      - name: Download v0.1.10 release artifact
        run: |
          curl -L -o forkpress-aarch64-apple-darwin.tar.gz \
            https://github.com/Automattic/forkpress/releases/download/v0.1.10/forkpress-aarch64-apple-darwin.tar.gz
          tar -xzf forkpress-aarch64-apple-darwin.tar.gz
          chmod +x forkpress

      - name: CAS main host smoke
        run: |
          set -euo pipefail
          BIN="$(pwd)/forkpress"
          TMP="$(mktemp -d /tmp/forkpress-release-cas.XXXXXX)"
          STATE="$TMP/state"
          SITE="$TMP/site"
          export FORKPRESS_STATE_DIR="$STATE"
          mkdir -p "$STATE" "$SITE"
          cleanup() {
            "$BIN" server stop --work-dir "$SITE/.forkpress" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cd "$SITE"
          "$BIN" init --strategy cas --admin-password admin
          "$BIN" server start --background
          curl -v "http://wp.localhost:18080/" -o "$TMP/home.html"
          grep -F "<title>ForkPress" "$TMP/home.html"

  linux-zfs-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang curl git pkg-config unzip \
            musl-tools php-cli composer re2c bison nodejs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust unit tests
        run: FORKPRESS_RUNTIME_BUNDLE=/dev/null cargo test -p forkpress

      - name: Build dist bundle
        run: scripts/build-dist.sh
        env:
          FORKPRESS_TARGET: x86_64-unknown-linux-musl
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build forkpress
        run: cargo build --release --target x86_64-unknown-linux-musl -p forkpress

      - name: ZFS strategy e2e
        run: tests/test_zfs_strategy_e2e.sh target/x86_64-unknown-linux-musl/release/forkpress

      - name: CAS strategy e2e
        run: tests/test_cas_strategy_e2e.sh target/x86_64-unknown-linux-musl/release/forkpress

  mac-zfs-engine:
    name: mac-zfs-engine ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust unit tests
        run: FORKPRESS_RUNTIME_BUNDLE=/dev/null cargo test --target ${{ matrix.target }} -p forkpress

      - name: Install runtime build tools
        run: |
          brew install composer gpatch
          brew install php || true

      - name: Build dist bundle
        run: scripts/build-dist.sh
        env:
          FORKPRESS_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build forkpress
        run: cargo build --release --target ${{ matrix.target }} -p forkpress

      - name: CAS strategy e2e
        run: tests/test_cas_strategy_e2e.sh target/${{ matrix.target }}/release/forkpress

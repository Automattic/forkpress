name: buildkite-log-diagnose

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Buildkite build number
        required: true
      job_id:
        description: Buildkite job UUID
        required: true

permissions:
  contents: read

jobs:
  log-tail:
    runs-on: ubuntu-24.04
    environment: buildkite
    steps:
      - name: Fetch redacted Buildkite job log tail
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          BUILDKITE_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILDKITE_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          api="https://api.buildkite.com/v2/organizations/automattic/pipelines/forkpress/builds/${BUILDKITE_BUILD_NUMBER}/jobs/${BUILDKITE_JOB_ID}/log"
          curl -fsS -H "Authorization: Bearer ${BUILDKITE_TOKEN}" "$api" -o buildkite-log-response

          python3 - <<'PY'
          import json
          import pathlib
          import re

          raw = pathlib.Path("buildkite-log-response").read_text(errors="replace")
          try:
              parsed = json.loads(raw)
              content = parsed.get("content", raw) if isinstance(parsed, dict) else raw
          except json.JSONDecodeError:
              content = raw

          content = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", content)
          redactions = [
              (r"(?i)(token|password|secret|key)=\S+", r"\1=[REDACTED]"),
              (r"(?i)(Authorization: Bearer )\S+", r"\1[REDACTED]"),
              (r"(?i)(BUILDKITE_TOKEN=)\S+", r"\1[REDACTED]"),
              (r"(?i)(GITHUB_TOKEN=)\S+", r"\1[REDACTED]"),
          ]
          for pattern, replacement in redactions:
              content = re.sub(pattern, replacement, content)

          lines = content.splitlines()
          print("\n".join(lines[-250:]))
          PY

    <path d="M151 244h95c36 0 65-29 65-65v-26" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <path d="M151 154h254" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round"/>
    <circle cx="151" cy="64" r="13" fill="#5eead4"/>
    <circle cx="151" cy="154" r="13" fill="#93c5fd"/>
    <circle cx="151" cy="244" r="13" fill="#fbbf24"/>

    <g>
      <rect x="0" y="13" width="165" height="102" rx="22" fill="#f8fafc"/>
      <rect x="18" y="32" width="129" height="13" rx="6.5" fill="#0f172a" opacity="0.18"/>
      <rect x="18" y="58" width="78" height="12" rx="6" fill="#14b8a6"/>
      <rect x="18" y="83" width="112" height="10" rx="5" fill="#0f172a" opacity="0.16"/>

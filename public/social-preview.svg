    </g>
    <g transform="translate(310 103)">
      <rect x="0" y="0" width="182" height="105" rx="22" fill="#ffffff"/>
      <rect x="19" y="20" width="141" height="14" rx="7" fill="#0f172a" opacity="0.18"/>
      <rect x="19" y="49" width="96" height="12" rx="6" fill="#f59e0b"/>
      <rect x="19" y="75" width="125" height="10" rx="5" fill="#0f172a" opacity="0.16"/>
      <text x="20" y="139" fill="#fde68a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="780">preview URL</text>
    </g>
    <g transform="translate(0 193)">
      <rect x="0" y="0" width="165" height="102" rx="22" fill="#f8fafc"/>
      <rect x="18" y="20" width="129" height="13" rx="6.5" fill="#0f172a" opacity="0.18"/>
      <rect x="18" y="47" width="100" height="12" rx="6" fill="#38bdf8"/>
      <rect x="18" y="73" width="112" height="10" rx="5" fill="#0f172a" opacity="0.16"/>
      <text x="18" y="136" fill="#bae6fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="780">agent-2</text>
    </g>
  </g>

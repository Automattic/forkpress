<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1260" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ForkPress social preview</title>
  <desc id="desc">ForkPress: branch WordPress like code. Preview isolated changes and merge files and databases with audit trails.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.48" stop-color="#142f32"/>
      <stop offset="1" stop-color="#0d1716"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1070" cy="92" r="210" fill="#14b8a6" opacity="0.13"/>
  <circle cx="1070" cy="530" r="270" fill="#f59e0b" opacity="0.09"/>
  <circle cx="82" cy="560" r="250" fill="#38bdf8" opacity="0.08"/>

  <g transform="translate(82 54)">
    <rect width="82" height="82" rx="19" fill="#f8fafc"/>
    <rect x="10" y="10" width="62" height="62" rx="13" fill="#111827"/>
    <g fill="none" stroke="#f9fafb" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.6">
      <path d="M29 19v20"/>
      <path d="M41 19v20"/>
      <path d="M53 19v20"/>
      <path d="M29 39c0 7 6 12 12 12s12-5 12-12"/>
      <path d="M41 51v13"/>
    </g>
    <text x="108" y="35" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800">ForkPress</text>
    <text x="110" y="69" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600">local WordPress branching</text>
  </g>

  <g transform="translate(82 220)">
    <text fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="850" letter-spacing="-1">
      <tspan x="0" y="0">Branch WordPress</tspan>
      <tspan x="0" y="76">like code.</tspan>
    </text>
    <text fill="#d1d5db" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="520">
      <tspan x="0" y="145">Preview isolated site changes.</tspan>
      <tspan x="0" y="189">Merge files and databases with audit trails.</tspan>
    </text>
  </g>

  <g transform="translate(82 500)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="760">
    <g>
      <rect width="192" height="50" rx="25" fill="#ecfeff" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.5"/>
      <circle cx="28" cy="25" r="7" fill="url(#teal)"/>
      <text x="48" y="33" fill="#ccfbf1">agent branches</text>
    </g>
    <g transform="translate(216 0)">
      <rect width="188" height="50" rx="25" fill="#fef3c7" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
      <circle cx="28" cy="25" r="7" fill="url(#gold)"/>
      <text x="48" y="33" fill="#fde68a">branch previews</text>
    </g>
    <g transform="translate(428 0)">
      <rect width="174" height="50" rx="25" fill="#e0f2fe" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
      <circle cx="28" cy="25" r="7" fill="#38bdf8"/>
      <text x="48" y="33" fill="#bae6fd">COW storage</text>
    </g>

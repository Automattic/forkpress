[package]
name = "forkpress-storage"
version = "0.1.45"
edition = "2024"

[features]
default = []

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
forkpress-core = { path = "../forkpress-core" }
forkpress-runtime = { path = "../forkpress-runtime" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[package]
name = "forkpress-cli"
version = "0.1.41"
edition = "2024"
build = "build.rs"
autobins = false

[features]
default = []
dev-experiments = ["dep:forkpress-cas-store", "forkpress-core/dev-experiments"]

[[bin]]
name = "forkpress"
path = "src/bin/forkpress.rs"

[[bin]]
name = "forkpress-dev"
path = "src/bin/forkpress-dev.rs"
required-features = ["dev-experiments"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
flate2 = "1.1"
forkpress-core = { path = "../forkpress-core" }
forkpress-runtime = { path = "../forkpress-runtime" }
forkpress-storage = { path = "../forkpress-storage" }
forkpress-server = { path = "../forkpress-server" }
forkpress-git = { path = "../forkpress-git" }
forkpress-cas-store = { path = "../../experiments/cas/crates/cas-store", optional = true }
libc = "0.2"
num_cpus = "1.16"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[build-dependencies]
anyhow = "1.0"
flate2 = "1.1"
tar = "0.4"
walkdir = "2.5"

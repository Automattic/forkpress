services:
  wp-cow-lab:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wp-cow-lab
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    dns:
      - "${WPCOW_DNS1:-1.1.1.1}"
      - "${WPCOW_DNS2:-8.8.8.8}"
    ports:
      - "${WPCOW_HTTP_PORT:-8080}:8080"
    environment:
      WPCOW_HOME: /root/.wp-cow
      WPCOW_NAME: "${WPCOW_NAME:-example}"
      WPCOW_SSH: "${WPCOW_SSH:-}"
      WPCOW_PATH: "${WPCOW_PATH:-}"
      WPCOW_REMOTE_URL: "${WPCOW_REMOTE_URL:-}"
      WPCOW_LOCAL_URL: "${WPCOW_LOCAL_URL-}"
      WPCOW_SKIP_SCHEMA: "${WPCOW_SKIP_SCHEMA:-0}"
      WPCOW_NO_PROBE: "${WPCOW_NO_PROBE:-0}"
      WPCOW_DNS1: "${WPCOW_DNS1:-1.1.1.1}"
      WPCOW_DNS2: "${WPCOW_DNS2:-8.8.8.8}"
      WPCOW_CACHE_MAX_FILE_MB: "${WPCOW_CACHE_MAX_FILE_MB:-64}"
      WPCOW_HTTP_PORT: "${WPCOW_HTTP_PORT:-8080}"
      WPCOW_MOUNTPOINT: "/mnt/wp-cow/${WPCOW_NAME:-example}"
      WPCOW_HTTP: 0.0.0.0:8080
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - wp-cow-state:/root/.wp-cow
      - wp-cow-mounts:/mnt/wp-cow
      - type: bind
        source: ${HOME}/.ssh
        target: /host-ssh
        read_only: true
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock

volumes:
  wp-cow-state:
  wp-cow-mounts:

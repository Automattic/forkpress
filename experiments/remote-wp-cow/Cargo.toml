[package]
name = "wp-cow"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
fuser = "0.16"
hex = "0.4"
libc = "0.2"
msql-srv = { version = "0.11", default-features = false }
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
url = "2.5"

[dev-dependencies]
tempfile = "3.13"

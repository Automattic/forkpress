# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":mag: COW changed preflight"
    key: cow-changed-preflight
    command: .buildkite/commands/cow-changed-preflight.sh
    plugins: [$CI_TOOLKIT_PLUGIN]
    agents:
      queue: default
    notify:
      - github_commit_status:
          context: "Buildkite / COW changed preflight"
